<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>玄学工具 · 小六壬 · 一掌经 · 大六壬 · 风水 · 生命数字</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #2b2b2b 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .main-title { text-align: center; margin-bottom: 36px; }
        .main-title h1 {
            font-size: 36px; letter-spacing: 8px; color: #f7d49e;
            text-shadow: 0 2px 16px rgba(0,0,0,0.6); font-weight: 400;
        }
        .main-title .sub {
            font-size: 14px; color: #b8a98a; letter-spacing: 4px;
            margin-top: 6px; border-bottom: 1px dashed rgba(255,215,150,0.15);
            padding-bottom: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            max-width: 480px;
            width: 100%;
        }
        @media (max-width: 400px) {
            .grid { grid-template-columns: 1fr; }
        }

        .menu-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 28px 16px 24px;
            text-align: center;
            text-decoration: none;
            color: #f0e6d0;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,215,150,0.15);
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
        }
        .menu-card:active {
            transform: translateY(0px);
        }
        .menu-card .icon {
            font-size: 48px;
            line-height: 1;
        }
        .menu-card .name {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #f7d49e;
        }
        .menu-card .desc {
            font-size: 13px;
            color: #b8a98a;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .menu-card .tag {
            display: inline-block;
            font-size: 11px;
            color: #7a6e58;
            background: rgba(255,215,150,0.08);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,150,0.08);
            margin-top: 4px;
        }

        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 12px;
            color: #4f4538;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="main-title">
        <h1>✦ 玄学工具 ✦</h1>
        <div class="sub">掐指一算 · 风水 · 生命数字</div>
    </div>

    <div class="grid">
        <a href="./tools.html" class="menu-card">
            <div class="icon">✨</div>
            <div class="name">掐指一算</div>
            <div class="desc">小六壬 · 一掌经 · 大六壬</div>
            <div class="tag">即时起课 · 掌诀吉凶</div>
        </a>

        <a href="./fengshui.html" class="menu-card">
            <div class="icon">🏠</div>
            <div class="name">风水罗盘</div>
            <div class="desc">九宫飞星 · 八宅 · 二十四山</div>
            <div class="tag">看Office风水 · 指南针</div>
        </a>

        <a href="./shengming.html" class="menu-card" style="grid-column: 1 / -1; max-width: 320px; margin: 0 auto; width: 100%;">
            <div class="icon">🔢</div>
            <div class="name">生命数字</div>
            <div class="desc">生命灵数 · 天赋数 · 性格解读</div>
            <div class="tag">用出生日期探索你的命运密码</div>
        </a>
    </div>

    <div class="footer">以智慧观照 · 以平常心生活</div>
</body>
</html>
