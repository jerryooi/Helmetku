<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>掐指一算 · 小六壬</title>
    <script src="./lunar.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #2b2b2b 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Microsoft YaHei', sans-serif;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-title { text-align: center; margin-bottom: 18px; }
        .main-title h1 {
            font-size: 30px; letter-spacing: 6px; color: #f7d49e;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6); font-weight: 400;
        }
        .main-title .sub {
            font-size: 14px; color: #b8a98a; letter-spacing: 4px; margin-top: 4px;
        }

        .card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 28px 24px 30px;
            max-width: 520px; width: 100%;
            box-shadow: 0 16px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            color: #f0e6d0; margin-bottom: 24px;
        }
        .card-header {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 1px dashed rgba(255,215,150,0.15);
            padding-bottom: 10px; margin-bottom: 16px; flex-wrap: wrap; gap: 6px;
        }
        .card-header h2 { font-size: 22px; letter-spacing: 4px; font-weight: 400; color: #f7d49e; }
        .card-header .badge {
            font-size: 12px; color: #b8a98a; background: rgba(255,215,150,0.1);
            padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,215,150,0.15);
        }

        /* ===== 模式选择 ===== */
        .mode-tabs {
            display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap;
        }
        .mode-tab {
            padding: 8px 16px; border-radius: 22px;
            border: 1px solid rgba(255,215,150,0.12);
            background: rgba(255,255,255,0.03);
            color: #b8a98a; font-size: 13px; cursor: pointer;
            transition: all 0.2s; letter-spacing: 1px; white-space: nowrap;
        }
        .mode-tab.active {
            background: rgba(247,212,158,0.14);
            border-color: rgba(247,212,158,0.28);
            color: #f7d49e;
        }
        .mode-tab:hover { background: rgba(255,255,255,0.06); }

        /* ===== 输入区 ===== */
        .input-panel { display: none; margin-bottom: 10px; }
        .input-panel.show { display: block; }
        .input-row {
            display: flex; gap: 8px; align-items: center;
            justify-content: center; flex-wrap: wrap;
        }
        .input-row select, .input-row input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,215,150,0.12);
            padding: 10px 12px; border-radius: 30px; color: #f0e6d0;
            font-size: 15px; outline: none; text-align: center;
            min-width: 60px;
        }
        .input-row select:focus, .input-row input:focus { border-color: #f7d49e; }
        .input-row input[type="date"] { width: 170px; }
        .input-row input[type="number"] { width: 80px; }
        .input-hint {
            font-size: 11px; color: #7a6e58; text-align: center; margin-top: 8px; letter-spacing: 1px;
        }

        .btn-wrap { text-align: center; margin: 10px 0; }
        .calc-btn {
            background: radial-gradient(circle at 30% 20%, #f7d49e, #c4925a);
            border: none; padding: 14px 36px; font-size: 20px; font-weight: 600;
            color: #1e1e2f; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #7a5e3a, 0 10px 24px rgba(0,0,0,0.5);
            letter-spacing: 4px; transition: all 0.12s ease;
            width: 100%; max-width: 240px;
        }
        .calc-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #7a5e3a; }
        .calc-btn:hover { filter: brightness(1.08); }

        .result-box {
            background: rgba(0,0,0,0.35); border-radius: 24px;
            padding: 18px 16px 20px; border: 1px solid rgba(255,200,150,0.1);
            min-height: 80px;
        }
        .empty-state {
            color: #8f8068; font-size: 16px; letter-spacing: 2px;
            padding: 20px 0; text-align: center;
        }

        /* ===== 共用组件 ===== */
        .info-bar {
            display: flex; flex-wrap: wrap; gap: 6px 12px;
            padding: 8px 12px; background: rgba(255,255,255,0.04);
            border-radius: 14px; border: 1px solid rgba(255,215,150,0.06);
            margin-bottom: 12px;
        }
        .info-bar .label { font-size: 11px; color: #7a6e58; letter-spacing: 1px; }
        .info-bar .value { font-size: 15px; color: #eacc9a; font-weight: 500; }
        .info-bar .sep { color: #4f4538; }

        .tag {
            display: inline-block; padding: 1px 12px; border-radius: 14px;
            font-size: 13px; background: rgba(255,215,150,0.10);
            border: 1px solid rgba(255,200,150,0.15); color: #eacc9a;
        }
        .tag-green { background: rgba(100,200,150,0.12); border-color: rgba(100,200,150,0.2); color: #a0d8b0; }
        .tag-red { background: rgba(220,100,100,0.12); border-color: rgba(220,100,100,0.2); color: #d8a0a0; }
        .tag-gold { background: rgba(247,212,158,0.15); border-color: rgba(247,212,158,0.25); color: #fadc9f; }
        .tag-blue { background: rgba(140,180,220,0.12); border-color: rgba(140,180,220,0.2); color: #b0c8e0; }

        /* ===== 三宫解读 ===== */
        .three-palace {
            display: grid; grid-template-columns: 1fr auto 1fr auto 1fr;
            gap: 4px; align-items: center; margin-bottom: 14px;
        }
        .three-palace .tp-step {
            background: rgba(255,255,255,0.03); border-radius: 14px;
            padding: 10px 6px; text-align: center;
            border: 1px solid rgba(255,215,150,0.08);
        }
        .three-palace .tp-label { font-size: 10px; color: #7a6e58; letter-spacing: 1px; }
        .three-palace .tp-name { font-size: 18px; font-weight: 600; color: #f0dcc0; margin-top: 2px; letter-spacing: 2px; }
        .three-palace .tp-attr { font-size: 11px; margin-top: 2px; }
        .three-palace .tp-arrow { color: #4f4538; font-size: 16px; text-align: center; }
        .three-palace .tp-final { border-color: rgba(247,212,158,0.25); background: rgba(247,212,158,0.06); }

        /* ===== 分类断辞标签 ===== */
        .cat-tabs {
            display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0 8px;
        }
        .cat-tab {
            padding: 5px 11px; border-radius: 16px; font-size: 12px;
            cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
            border: 1px solid rgba(255,215,150,0.08);
            background: rgba(255,255,255,0.02); color: #8f8068;
        }
        .cat-tab.active {
            background: rgba(247,212,158,0.12);
            border-color: rgba(247,212,158,0.25); color: #f7d49e;
        }
        .cat-tab:hover { background: rgba(255,255,255,0.05); }
        .cat-content {
            font-size: 14px; line-height: 1.8; color: #d4c5a6;
            padding: 10px 12px; background: rgba(255,215,150,0.04);
            border-radius: 14px; border: 1px solid rgba(255,200,150,0.06);
            min-height: 40px;
        }

        /* ===== 小六壬结果 ===== */
        .xlr-result .gua-name {
            font-size: 34px; font-weight: 600; letter-spacing: 8px;
            color: #fadc9f; margin: 2px 0;
        }
        .xlr-result .gua-row {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 8px 16px; margin: 6px 0 8px;
        }
        .xlr-result .gua-detail-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0;
        }
        .xlr-result .gd-item {
            background: rgba(255,255,255,0.03); border-radius: 12px;
            padding: 8px 12px; font-size: 14px;
        }
        .gd-item .gd-label { font-size: 11px; color: #7a6e58; }
        .gd-item .gd-value { color: #d4c5a6; margin-top: 2px; }

        .xlr-result .gua-judge {
            padding: 10px 14px; background: rgba(255,215,150,0.06);
            border-radius: 16px; border: 1px solid rgba(255,200,150,0.1);
            margin-top: 10px;
        }
        .gua-judge .jg-label { font-size: 12px; color: #7a6e58; letter-spacing: 2px; }
        .gua-judge .jg-text { font-size: 16px; color: #f0dcc0; margin-top: 4px; line-height: 1.7; }

        .footer { text-align: center; font-size: 12px; color: #4f4538; letter-spacing: 2px; margin-top: 4px; }
        .back-link { text-align: center; margin-top: 14px; }
        .back-link a {
            color: #8a9a90; text-decoration: none; font-size: 14px;
            letter-spacing: 2px; border: 1px solid rgba(255,215,150,0.1);
            padding: 10px 24px; border-radius: 30px; display: inline-block;
            transition: all 0.2s;
        }
        .back-link a:hover { border-color: rgba(255,215,150,0.25); color: #b8a98a; }

        @media (max-width: 420px) {
            body { padding: 14px 12px 30px; }
            .card { padding: 20px 16px 22px; border-radius: 28px; }
            .card-header h2 { font-size: 20px; }
            .xlr-result .gua-name { font-size: 28px; }
            .calc-btn { font-size: 18px; padding: 12px 28px; max-width: 200px; }
            .xlr-result .gua-detail-grid { grid-template-columns: 1fr 1fr; }
            .three-palace .tp-name { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="main-title">
    <h1>✦ 掐指一算 ✦</h1>
    <div class="sub">小六壬 · 即时起课 · 掌诀吉凶</div>
</div>

<div class="card">
    <div class="card-header">
        <h2>小六壬</h2>
        <span class="badge">六掌诀 · 吉凶方位</span>
    </div>

    <!-- 模式选择 -->
    <div class="mode-tabs">
        <span class="mode-tab active" data-mode="auto">⏱ 当下起课</span>
        <span class="mode-tab" data-mode="lunar">🌙 农历</span>
        <span class="mode-tab" data-mode="solar">📅 公历</span>
        <span class="mode-tab" data-mode="num">🔢 数字</span>
    </div>

    <!-- 当下起课：只需按钮 -->
    <div class="input-panel show" id="panelAuto">
        <div class="input-hint">自动取当前农历月日时</div>
    </div>

    <!-- 农历输入 -->
    <div class="input-panel" id="panelLunar">
        <div class="input-row">
            <select id="lunMonth"></select>
            <span style="color:#7a6e58;">月</span>
            <select id="lunDay"></select>
            <span style="color:#7a6e58;">日</span>
            <select id="lunHour"></select>
            <span style="color:#7a6e58;">时</span>
        </div>
    </div>

    <!-- 公历输入 -->
    <div class="input-panel" id="panelSolar">
        <div class="input-row">
            <input type="date" id="solarDate" />
            <select id="solarHour"></select>
            <span style="color:#7a6e58;">时</span>
        </div>
    </div>

    <!-- 数字起卦 -->
    <div class="input-panel" id="panelNum">
        <div class="input-row">
            <input type="number" id="num1" placeholder="数一" min="1" value="" />
            <input type="number" id="num2" placeholder="数二" min="1" value="" />
            <input type="number" id="num3" placeholder="数三" min="1" value="" />
        </div>
        <div class="input-hint">随意三个正整数 · 心诚则灵</div>
    </div>

    <div class="btn-wrap">
        <button class="calc-btn" id="btnXlr">起 卦</button>
    </div>

    <!-- 结果区 -->
    <div class="result-box" id="xlrBox">
        <div class="empty-state" id="xlrEmpty">选择模式 · 点击起卦</div>
        <div class="xlr-result" id="xlrContent" style="display:none;">

            <!-- 三宫 -->
            <div class="three-palace" id="threePalace"></div>

            <div class="gua-name" id="xlrName"></div>
            <div class="gua-row">
                <span class="tag tag-gold" id="xlrAttr"></span>
                <span class="tag tag-blue" id="xlrDir"></span>
                <span class="tag" id="xlrNum"></span>
            </div>

            <div class="gua-detail-grid">
                <div class="gd-item">
                    <div class="gd-label">五行</div>
                    <div class="gd-value" id="xlrWx"></div>
                </div>
                <div class="gd-item">
                    <div class="gd-label">神兽</div>
                    <div class="gd-value" id="xlrShen"></div>
                </div>
                <div class="gd-item">
                    <div class="gd-label">所主</div>
                    <div class="gd-value" id="xlrSuoZhu"></div>
                </div>
                <div class="gd-item">
                    <div class="gd-label">宜忌</div>
                    <div class="gd-value" id="xlrYj"></div>
                </div>
            </div>

            <!-- 分类断辞 -->
            <div class="cat-tabs" id="catTabs"></div>
            <div class="cat-content" id="catContent"></div>

            <div class="gua-judge" style="margin-top:10px;">
                <div class="jg-label">▼ 综合断辞</div>
                <div class="jg-text" id="xlrJudge"></div>
            </div>

            <div class="info-bar" style="margin-top:10px;">
                <span class="label">起课</span>
                <span class="value" id="xlrPath"></span>
            </div>
        </div>
    </div>
</div>

<div class="back-link"><a href="./index_Oracle.html">‹ 返回首页</a></div>
<div class="footer">月·日·时 三数定吉凶 · 子正换日</div>

    // ========== 小六壬算法 ==========
    function calcXlrIndex(m, d, h) {
        let i = (m - 1) % 6;
        let i1 = i; // 月宫
        i = (i + (d - 1)) % 6;
        let i2 = i; // 日宫
        i = (i + (h - 1)) % 6;
        let i3 = i; // 时宫
        return { moonIdx: i1, dayIdx: i2, hourIdx: i3 };
    }

    // ========== 三宫 HTML ==========
    function renderThreePalace(idxs) {
        const m = XLR[idxs.moonIdx];
        const d = XLR[idxs.dayIdx];
        const h = XLR[idxs.hourIdx];
        let html = '';
        // 月宫
        html += '<div class="tp-step"><div class="tp-label">🌙 月宫 · 起因</div>';
        html += '<div class="tp-name">'+m.name+'</div>';
        html += '<div class="tp-attr" style="color:'+(m.attr.includes('吉')&&!m.attr.includes('凶')?'#a0d8b0':'#d8a0a0')+'">'+m.attr+'</div></div>';
        html += '<div class="tp-arrow">→</div>';
        // 日宫
        html += '<div class="tp-step"><div class="tp-label">☀️ 日宫 · 过程</div>';
        html += '<div class="tp-name">'+d.name+'</div>';
        html += '<div class="tp-attr" style="color:'+(d.attr.includes('吉')&&!d.attr.includes('凶')?'#a0d8b0':'#d8a0a0')+'">'+d.attr+'</div></div>';
        html += '<div class="tp-arrow">→</div>';
        // 时宫 (最终)
        html += '<div class="tp-step tp-final"><div class="tp-label">⭐ 时宫 · 结果</div>';
        html += '<div class="tp-name" style="color:#fadc9f;">'+h.name+'</div>';
        html += '<div class="tp-attr" style="color:'+(h.attr.includes('吉')&&!h.attr.includes('凶')?'#a0d8b0':'#d8a0a0')+'">'+h.attr+'</div></div>';
        document.getElementById('threePalace').innerHTML = html;
    }

    // ========== 分类断辞标签 ==========
    let currentCat = 'general';
    let currentGua = null;

    function renderCatTabs() {
        let html = '';
        CAT_KEYS.forEach(function(k, i) {
            html += '<span class="cat-tab'+(k===currentCat?' active':'')+'" data-cat="'+k+'">'+CAT_NAMES[i]+'</span>';
        });
        document.getElementById('catTabs').innerHTML = html;

        // 绑定事件
        document.querySelectorAll('#catTabs .cat-tab').forEach(function(el) {
            el.addEventListener('click', function() {
                currentCat = this.getAttribute('data-cat');
                document.querySelectorAll('#catTabs .cat-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                if (currentGua) {
                    document.getElementById('catContent').textContent = currentGua.cats[currentCat];
                }
            });
        });
    }

    function updateCatContent(gua) {
        currentGua = gua;
        currentCat = 'general';
        document.querySelectorAll('#catTabs .cat-tab').forEach(function(t) {
            t.classList.toggle('active', t.getAttribute('data-cat') === 'general');
        });
        document.getElementById('catContent').textContent = gua.cats.general;
    }

    // ========== 主更新函数 ==========
    function updateXlr(m, d, h, pathStr) {
        var idxs = calcXlrIndex(m, d, h);
        var g = XLR[idxs.hourIdx];

        document.getElementById('xlrEmpty').style.display = 'none';
        document.getElementById('xlrContent').style.display = 'block';

        // 三宫
        renderThreePalace(idxs);

        // 基本信息
        document.getElementById('xlrName').textContent = g.name;
        document.getElementById('xlrAttr').textContent = g.attr;
        document.getElementById('xlrDir').textContent = '方向 ' + g.dir;
        document.getElementById('xlrNum').textContent = '主数 ' + g.num;
        document.getElementById('xlrWx').textContent = g.wx;
        document.getElementById('xlrShen').textContent = g.shen;
        document.getElementById('xlrSuoZhu').textContent = g.suoZhu;
        document.getElementById('xlrYj').textContent = g.yj;
        document.getElementById('xlrJudge').textContent = g.judge;

        // 分类断辞
        updateCatContent(g);

        // 起课路径
        document.getElementById('xlrPath').textContent = pathStr;
    }

    // ========== 模式处理 ==========
    var currentMode = 'auto';

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('.mode-tab[data-mode="'+mode+'"]').classList.add('active');
        document.querySelectorAll('.input-panel').forEach(function(p) { p.classList.remove('show'); });
        document.getElementById('panel'+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add('show');
    }

    document.querySelectorAll('.mode-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            switchMode(this.getAttribute('data-mode'));
        });
    });

    // 初始化农历选择器
    function initLunarSelects() {
        var mSel = document.getElementById('lunMonth');
        var dSel = document.getElementById('lunDay');
        var hSel = document.getElementById('lunHour');
        for (var i=1; i<=12; i++) {
            var opt = document.createElement('option');
            opt.value = i;
            opt.textContent = (i<10?' ':'') + i + ' 月';
            mSel.appendChild(opt);
        }
        for (var j=1; j<=30; j++) {
            var opt2 = document.createElement('option');
            opt2.value = j;
            opt2.textContent = (j<10?' ':'') + j + ' 日';
            dSel.appendChild(opt2);
        }
        SHICHEN.forEach(function(n, idx) {
            var opt3 = document.createElement('option');
            opt3.value = idx;
            opt3.textContent = n + ' 时 ('+(idx*2===0?24:idx*2)+'时区)';
            hSel.appendChild(opt3);
        });
    }

    function initSolarSelects() {
        var hSel = document.getElementById('solarHour');
        SHICHEN.forEach(function(n, idx) {
            var opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = n + ' 时';
            hSel.appendChild(opt);
        });
        // 默认今天
        var today = new Date();
        document.getElementById('solarDate').value = today.getFullYear()+'-'+
            String(today.getMonth()+1).padStart(2,'0')+'-'+
            String(today.getDate()).padStart(2,'0');
    }

    // ========== 起卦处理 ==========
    function handleCalc() {
        var m, d, h, pathStr;

        if (currentMode === 'auto') {
            var now = new Date();
            var l = Lunar.fromDate(now);
            m = l.getMonth();
            d = l.getDay();
            h = l.getTimeZhiIndex() + 1;
            var p1 = XLR[(m-1)%6].name;
            var p2 = XLR[((m-1)%6 + d - 1)%6].name;
            pathStr = '当下 · '+l.getMonthInChinese()+'月'+l.getDayInChinese()+'日 '+SHICHEN[l.getTimeZhiIndex()]+'时 → 大安→'+p1+'→'+p2+'→'+XLR[((m-1)%6+d-1+h-1)%6].name;
        } else if (currentMode === 'lunar') {
            m = parseInt(document.getElementById('lunMonth').value);
            d = parseInt(document.getElementById('lunDay').value);
            h = parseInt(document.getElementById('lunHour').value) + 1;
            var p1 = XLR[(m-1)%6].name;
            var p2 = XLR[((m-1)%6 + d - 1)%6].name;
            pathStr = '农历 '+m+'月'+d+'日 '+SHICHEN[h-1]+'时 → 大安→'+p1+'→'+p2+'→'+XLR[((m-1)%6+d-1+h-1)%6].name;
        } else if (currentMode === 'solar') {
            var dateVal = document.getElementById('solarDate').value;
            if (!dateVal) { alert('请选择公历日期'); return; }
            var parts = dateVal.split('-');
            var sd = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
            var l = Lunar.fromDate(sd);
            m = l.getMonth();
            d = l.getDay();
            h = parseInt(document.getElementById('solarHour').value) + 1;
            var p1 = XLR[(m-1)%6].name;
            var p2 = XLR[((m-1)%6 + d - 1)%6].name;
            pathStr = '公历 '+dateVal+' '+SHICHEN[h-1]+'时 → 农历'+l.getMonthInChinese()+'月'+l.getDayInChinese()+'日 → 大安→'+p1+'→'+p2+'→'+XLR[((m-1)%6+d-1+h-1)%6].name;
        } else if (currentMode === 'num') {
            var n1 = parseInt(document.getElementById('num1').value);
            var n2 = parseInt(document.getElementById('num2').value);
            var n3 = parseInt(document.getElementById('num3').value);
            if (isNaN(n1)||isNaN(n2)||isNaN(n3)||n1<1||n2<1||n3<1) {
                alert('请输入三个大于 0 的正整数');
                return;
            }
            m = n1; d = n2; h = n3;
            var p1 = XLR[(n1-1)%6].name;
            var p2 = XLR[((n1-1)%6 + n2 - 1)%6].name;
            pathStr = '数字起卦 ['+n1+'·'+n2+'·'+n3+'] → 大安→'+p1+'→'+p2+'→'+XLR[((n1-1)%6+n2-1+n3-1)%6].name;
        }

        updateXlr(m, d, h, pathStr);
    }

    // ========== 事件绑定 ==========
    document.getElementById('btnXlr').addEventListener('click', handleCalc);

    // ========== 初始化 ==========
    window.addEventListener('DOMContentLoaded', function() {
        initLunarSelects();
        initSolarSelects();
        renderCatTabs();
        // 自动起一卦
        setTimeout(handleCalc, 150);
    });

})();
</script>
