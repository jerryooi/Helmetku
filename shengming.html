<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>生命数字 · 完整命盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a1a2e 0%, #2b2b2b 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Microsoft YaHei', sans-serif;
            padding: 20px 16px 40px;
            color: #f0e6d0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 28px 22px 30px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 16px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 18px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 28px; letter-spacing: 6px; color: #f7d49e;
            font-weight: 400; text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        .header .sub { font-size: 13px; color: #8a9a90; letter-spacing: 3px; margin-top: 4px; }

        .input-row {
            display: flex; gap: 10px; align-items: center;
            justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
        }
        .input-row input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,215,150,0.12);
            padding: 12px 16px; border-radius: 30px; color: #f0e6d0;
            font-size: 16px; outline: none; width: 170px; text-align: center;
        }
        .input-row input:focus { border-color: #f7d49e; }
        .input-row button {
            background: radial-gradient(circle at 30% 20%, #d4b8d8, #a888b0);
            border: none; padding: 12px 28px; border-radius: 30px;
            color: #1a1a2e; font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 0 #6a5a72; transition: all 0.1s;
            letter-spacing: 2px;
        }
        .input-row button:active { transform: translateY(4px); box-shadow: 0 0 0 #6a5a72; }

        .result-area { display: none; }
        .result-area.show { display: block; }

        /* ===== 主数字大显示 ===== */
        .hero-num {
            text-align: center; padding: 18px 10px 14px;
            background: rgba(247,212,158,0.04);
            border-radius: 24px;
            border: 1px solid rgba(255,215,150,0.08);
            margin-bottom: 16px;
        }
        .hero-num .big {
            font-size: 80px; font-weight: 700; color: #fadc9f;
            text-shadow: 0 0 40px rgba(247,212,158,0.12);
            line-height: 1;
        }
        .hero-num .big-name { font-size: 24px; color: #f0dcc0; letter-spacing: 4px; margin-top: 4px; }
        .hero-num .big-keyword { font-size: 15px; color: #b8a98a; margin-top: 4px; letter-spacing: 2px; }
        .hero-num .big-date { font-size: 13px; color: #7a6e58; margin-top: 6px; }

        /* ===== 数字网格 ===== */
        .num-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
            margin-bottom: 14px;
        }
        .num-grid .ng-item {
            background: rgba(255,255,255,0.03);
            border-radius: 14px; padding: 12px 8px; text-align: center;
            border: 1px solid rgba(255,215,150,0.05);
        }
        .ng-item .ng-label { font-size: 10px; color: #7a6e58; letter-spacing: 1px; }
        .ng-item .ng-val { font-size: 26px; font-weight: 600; color: #fadc9f; margin-top: 2px; }
        .ng-item .ng-name { font-size: 11px; color: #b8a98a; margin-top: 2px; }

        .section-title {
            font-size: 13px; color: #8f8068; letter-spacing: 3px;
            margin: 14px 0 8px; border-left: 3px solid rgba(247,212,158,0.3);
            padding-left: 10px;
        }

        /* ===== 天赋数字 ===== */
        .talent-grid {
            display: grid; grid-template-columns: repeat(9,1fr); gap: 4px;
            margin: 8px 0 12px;
        }
        .talent-grid .tal-cell {
            background: rgba(255,255,255,0.03); border-radius: 10px;
            padding: 8px 2px; text-align: center;
            border: 1px solid rgba(255,215,150,0.04);
        }
        .tal-cell .tal-num { font-size: 20px; font-weight: 600; color: #fadc9f; }
        .tal-cell .tal-bar {
            height: 3px; border-radius: 2px; margin: 4px auto 0;
            max-width: 80%; transition: width 0.5s;
        }
        .tal-cell .tal-count { font-size: 10px; color: #7a6e58; margin-top: 2px; }

        /* ===== 信息区块 ===== */
        .info-block {
            padding: 14px 16px;
            background: rgba(247,212,158,0.04);
            border-radius: 16px;
            border: 1px solid rgba(255,200,150,0.06);
            margin-top: 8px;
        }
        .info-block .ib-title {
            font-size: 15px; color: #f7d49e; letter-spacing: 2px; margin-bottom: 6px;
        }
        .info-block .ib-text {
            font-size: 15px; color: #d4c5a6; line-height: 1.9;
        }
        .info-block .ib-text b { color: #fadc9f; }
        .info-block .ib-text .ok { color: #a0d8b0; }
        .info-block .ib-text .no { color: #d8a0a0; }

        .info-block.alt { background: rgba(200,200,220,0.04); border-color: rgba(200,200,220,0.06); }

        /* ===== 双栏 ===== */
        .double-col {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
            margin-top: 8px;
        }
        @media (max-width:400px) { .double-col { grid-template-columns: 1fr; } }
        .double-col .dc-item {
            background: rgba(255,255,255,0.03); border-radius: 12px;
            padding: 10px 12px; border: 1px solid rgba(255,215,150,0.04);
        }
        .dc-item .dc-label { font-size: 10px; color: #7a6e58; letter-spacing: 1px; }
        .dc-item .dc-val { font-size: 14px; color: #d4c5a6; margin-top: 4px; line-height: 1.6; }

        /* ===== 人生周期 ===== */
        .cycle-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
            margin-top: 8px;
        }
        .cycle-grid .cyc-item {
            background: rgba(255,255,255,0.03); border-radius: 12px;
            padding: 10px 8px; text-align: center;
            border: 1px solid rgba(255,215,150,0.04);
        }
        .cyc-item .cyc-label { font-size: 10px; color: #7a6e58; }
        .cyc-item .cyc-age { font-size: 11px; color: #b8a98a; }
        .cyc-item .cyc-num { font-size: 22px; font-weight: 600; color: #fadc9f; margin-top: 2px; }
        .cyc-item .cyc-name { font-size: 11px; color: #b8a98a; }

        .back-link { text-align: center; margin-top: 14px; }
        .back-link a {
            color: #8a9a90; text-decoration: none; font-size: 14px;
            letter-spacing: 2px; border: 1px solid rgba(255,215,150,0.1);
            padding: 10px 24px; border-radius: 30px; display: inline-block;
            transition: all 0.2s;
        }
        .back-link a:hover { border-color: rgba(255,215,150,0.25); color: #b8a98a; }

        .footer { text-align: center; font-size: 12px; color: #4f4538; letter-spacing: 2px; margin-top: 14px; }
    </style>
</head>

                    <div class="ng-name" id="dayName">—</div>
                </div>

                    <div class="ng-label">表现数</div>
                    <div class="ng-val" id="expressNum">—</div>
                    <div class="ng-name" id="expressName">—</div>
                </div>
                <div class="ng-item">
                    <div class="ng-label">人格数</div>
                    <div class="ng-val" id="personNum">—</div>
                    <div class="ng-name" id="personName">—</div>
                </div>
                <div class="ng-item">
                    <div class="ng-label">成熟数</div>
                    <div class="ng-val" id="matureNum">—</div>
                    <div class="ng-name" id="matureName">—</div>
                </div>
                <div class="ng-item">
                    <div class="ng-label">流年数</div>
                    <div class="ng-val" id="yearNum">—</div>
                    <div class="ng-name" id="yearName">—</div>
                </div>
                <div class="ng-item">
                    <div class="ng-label">挑战数</div>
                    <div class="ng-val" id="challengeNum">—</div>
                    <div class="ng-name" id="challengeName">—</div>
                </div>
            </div>

            <!-- 天赋数字能量分布 -->
            <div class="section-title">⊙ 数字能量分布</div>
            <div class="talent-grid" id="talentGrid"></div>

            <!-- 性格特质 -->
            <div class="section-title">⊙ 性格特质</div>
            <div class="info-block">
                <div class="ib-title" id="traitTitle">—</div>
                <div class="ib-text" id="traitText">—</div>
            </div>

            <div class="info-block alt">
                <div class="ib-text" id="prosCons">—</div>
            </div>

                    <div class="dc-label">适合职业</div>
                    <div class="dc-val" id="careerText">—</div>
                </div>
                <div class="dc-item">
                    <div class="dc-label">人际关系</div>
                    <div class="dc-val" id="relationText">—</div>
                </div>
                <div class="dc-item">
                    <div class="dc-label">幸运方向</div>
                    <div class="dc-val" id="luckyDir">—</div>
                </div>
                <div class="dc-item">
                    <div class="dc-label">幸运颜色·数字</div>
                    <div class="dc-val" id="luckyColor">—</div>
                </div>
            </div>

            <!-- 人生周期 -->
            <div class="section-title">⊙ 人生三大周期</div>
            <div class="cycle-grid" id="cycleGrid"></div>

            <!-- 流年运势 -->
            <div class="section-title">⊙ 今年流年运势</div>
            <div class="info-block alt">
                <div class="ib-title" id="yearTitle">—</div>
                <div class="ib-text" id="yearText">—</div>
            </div>

        </div>
    </div>

    <div class="back-link">
        <a href="./index.html">‹ 返回首页</a>
    </div>

                document.getElementById('expressName').textContent = getData(expressNum).name;
                document.getElementById('personNum').textContent = personNum;
                document.getElementById('personName').textContent = getData(personNum).name;
                document.getElementById('matureNum').textContent = matureNum;
                document.getElementById('matureName').textContent = getData(matureNum).name;
                document.getElementById('yearNum').textContent = yearNum;
                document.getElementById('yearName').textContent = getData(yearNum).name;
                document.getElementById('challengeNum').textContent = challengeNum;
                document.getElementById('challengeName').textContent = getData(challengeNum).name;

                // 能量分布
                const tGrid = document.getElementById('talentGrid');
                tGrid.innerHTML = '';
                const maxCount = Math.max.apply(null, Object.values(counts));
                for (let i = 1; i <= 9; i++) {
                    const c = document.createElement('div');
                    c.className = 'tal-cell';
                    const pct = maxCount > 0 ? (counts[i] / maxCount * 100) : 0;
                    const colors = ['#f7d49e','#d4b8d8','#a8d4c0','#b0c8e0','#d8c8a0','#d4a0a0','#a0b8d8','#c8b8a0','#d8b8c8'];
                    c.innerHTML =
                        '<div class="tal-num">' + i + '</div>' +
                        '<div class="tal-bar" style="width:' + pct + '%;background:' + colors[i-1] + '"></div>' +
                        '<div class="tal-count">' + counts[i] + 'x</div>';
                    tGrid.appendChild(c);
                }

                // 性格特质
                document.getElementById('traitTitle').textContent = '生命数字 ' + lifeNum + ' · ' + data.name;
                document.getElementById('traitText').innerHTML = data.trait;

                // 优缺点
                document.getElementById('prosCons').innerHTML = data.pros;

                // 职业与人际
                document.getElementById('careerText').textContent = data.career;
                document.getElementById('relationText').innerHTML = data.relation;
                document.getElementById('luckyDir').textContent = data.luckyDir;
                document.getElementById('luckyColor').textContent = data.luckyColor;

                // 人生周期
                const cycles = getCycles(lifeNum);
                const cycGrid = document.getElementById('cycleGrid');
                cycGrid.innerHTML = '';
                cycles.forEach(function(c) {
                    const item = document.createElement('div');
                    item.className = 'cyc-item';
                    const d = getData(c.num);
                    item.innerHTML =
                        '<div class="cyc-label">周期</div>' +
                        '<div class="cyc-age">' + c.age + '</div>' +
                        '<div class="cyc-num">' + c.num + '</div>' +
                        '<div class="cyc-name">' + (d ? d.name : '') + '</div>';
                    cycGrid.appendChild(item);
                });

                // 流年运势
                const yearData = getData(yearNum);
                document.getElementById('yearTitle').textContent =
                    yearNum + ' · ' + yearData.name;
                document.getElementById('yearText').innerHTML = getYearDesc(yearNum);
            }

            // ===== 初始化 =====
            document.getElementById('calcBtn').addEventListener('click', function() {
                const val = document.getElementById('birthDate').value;
                if (!val) { alert('请选择出生日期'); return; }
                updateResult(val);
            });

            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            document.getElementById('birthDate').value = y + '-' + m + '-' + d;

            window.addEventListener('DOMContentLoaded', function() {
                setTimeout(function() {
                    updateResult(document.getElementById('birthDate').value);
                }, 100);
            });
        })();
    </script>
</body>
</html>
